baseURL: "https://mythoshell.com/"
languageCode: "zh-cn"
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false
title: "mythoshell"
theme: "PaperMod"

pagination:
  pagerSize: 8

enableRobotsTXT: true
enableGitInfo: true

minify:
  minifyOutput: true

permalinks:
  posts: "/posts/:slug/"

outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML]

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  highlight:
    lineNos: false
    noClasses: true

params:
  env: production
  title: "mythoshell"
  description: "A developer's home for ideas, technology and beyond. 记录技术实践，探索架构设计，分享工程经验。"
  author: "mythoshell"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  ShowToc: true
  TocOpen: false
  comments: false
  disableSpecial1stPost: true
  displayFullLangName: true
  DateFormat: "2006-01-02"
  mainSections: [posts]
  assets:
    favicon: "/brand/favicon.svg"
    favicon16x16: "/brand/favicon-16x16.png"
    favicon32x32: "/brand/favicon-32x32.png"
    apple_touch_icon: "/brand/favicon-180x180.png"
  label:
    text: "mythoshell"
    icon: "/brand/mythoshell-mark.svg"
    iconHeight: 32
  cover:
    linkFullImages: true
    hiddenInList: false
    hiddenInSingle: false
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: [title, permalink, summary, content]
  socialIcons:
    - name: github
      url: "https://github.com/mythoshell"
  editPost:
    URL: "https://github.com/mythoshell/mythoshell-blog/tree/main/content"
    Text: "Suggest Changes"
    appendFilePath: true
  technicalDomains:
    - name: "Java"
      number: "01"
      icon: "{ }"
      description: "Java 基础、并发编程、JVM 原理与性能调优"

    - name: "Architecture"
      number: "02"
      icon: "⌘"
      description: "微服务、分布式系统、架构设计与演进"

    - name: "Middleware"
      number: "03"
      icon: "◈"
      description: "MySQL、Redis、Kafka、Nacos 与中间件"

    - name: "AI Agent"
      number: "04"
      icon: "✳"
      description: "LLM、RAG、Agent 应用与 AI 工程化"

    - name: "Languages"
      number: "05"
      icon: "</>"
      description: "Python、Go、Rust 及其他编程语言生态"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 5
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 25
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 35
    - identifier: about
      name: About
      url: /about/
      weight: 40

taxonomies:
  category: categories
  tag: tags
